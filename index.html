ayments.length?`<table><thead><tr><th>${t('date')}</th><th>${t('student')}</th><th>${t('feeMonth')}</th><th>${t('amountPaid')}</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(studentName(p.studentId))}</td><td>${esc(p.month)}</td><td>${money(p.amount)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${t('noRecords')}</div>`}</div></div></div>`}

function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function changeLang(l){lang=l;state.settings.lang=l;persist();render();toast(t('languageSaved'))}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
document.getElementById('langBtn').onclick=()=>changeLang(lang==='en'?'ur':'en');
document.getElementById('topAdd').onclick=()=>studentForm();
render();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
</script></body></html>
